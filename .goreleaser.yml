version: 2

project_name: pgscv

before:
  hooks:
    - make dep

builds:
  - id: pgscv
    binary: pgscv
    main: ./cmd
    goos:
      - linux
    #  - windows
    #  - freebsd
    #  - darwin
    goarch:
      - '386'
      - amd64
      - arm64
      - arm
    #ignore:
    #  - goarch: arm
    #    goos: windows
    #  - goarch: arm64
    #    goos: windows
    #  - goarch: arm64
    #    goos: freebsd
    env:
      - CGO_ENABLED=0
    ldflags:
      - -a -installsuffix cgo
      - -X main.appName=pgscv -X main.gitTag={{.Tag}} -X main.gitCommit={{.Commit}} -X main.gitBranch={{.Branch}}

archives:
  - id: pgscv
    ids: [pgscv]
    formats: ["tar.gz"]
#    format_overrides:
#      - goos: windows
#        formats: [zip]
    builds_info:
      group: root
      owner: root
    wrap_in_directory: false
    files:
      - LICENSE
      - src: "deploy/pgscv.yaml"
        strip_parent: true
        info:
          owner: root
          group: root
          mode: 0640
      - src: "deploy/pgscv.service"
        strip_parent: true
        info:
          owner: root
          group: root
          mode: 0644
      - src: "deploy/pgscv.service.rhel"
        strip_parent: true
        info:
          owner: root
          group: root
          mode: 0644
      - src: "deploy/pgscv.openrc"
        strip_parent: true
        info:
          owner: root
          group: root
          mode: 0755
      - src: "deploy/pgscv.default"
        strip_parent: true
        info:
          owner: root
          group: root
          mode: 0644
    name_template: >-
      {{- .Binary }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

source:
  enabled: true
  name_template: "{{ .ProjectName }}-{{ .Version }}-source"
  format: tar.gz

checksum:
  name_template: 'checksums.txt'

nfpms:
  - id: pgscv-deb-rpm
    package_name: pgscv
    file_name_template: "{{ .ConventionalFileName }}"
    ids: [pgscv]
    vendor: "pgSCV Team"
    homepage: https://github.com/cherts/pgscv
    maintainer: "Mikhail Grigorev <sleuthhound@gmail.com>"
    description: pgSCV - PostgreSQL ecosystem metrics collector.
    license: BSD-3
    section: database
    priority: optional
    formats: [deb, rpm, apk]
    bindir: /usr/sbin
    contents:
      - src: deploy/pgscv.service
        dst: /usr/lib/systemd/system/pgscv.service
        packager: deb
      - src: deploy/pgscv.service.rhel
        dst: /usr/lib/systemd/system/pgscv.service
        packager: rpm
      - src: deploy/pgscv.openrc
        dst: /etc/init.d/pgscv
        packager: apk
      - src: deploy/pgscv.default
        dst: /etc/default/pgscv
        type: "config|noreplace"
        packager: deb
      - src: deploy/pgscv.default
        dst: /etc/sysconfig/pgscv
        type: "config|noreplace"
        packager: rpm
      - src: LICENSE
        dst: /usr/share/doc/pgscv/LICENSE
      - src: README.md
        dst: /usr/share/doc/pgscv/README.md
      - src: deploy/pgscv.yaml
        dst: /etc/pgscv.yaml
        type: "config|noreplace"
        file_info:
          mode: 0640
    scripts:
      preinstall: deploy/scripts/preinstall.sh
      postinstall: deploy/scripts/postinstall.sh
      preremove: deploy/scripts/preremove.sh
      postremove: deploy/scripts/postremove.sh
    apk:
      scripts:
        preupgrade: deploy/scripts/preinstall.sh
        postupgrade: deploy/scripts/postinstall.sh

release:
  github:
    owner: cherts
    name: pgscv
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  header: |
    ## pgSCV v{{ .Version }}